name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # permite rodar manualmente: gh workflow run CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O nome do job precisa ser `ci`: os checks obrigatórios são `ci / lint`, `ci / test`,
  # `ci / conformance` e `ci / branch-name`. Os jobs estão em checks.yml.
  ci:
    uses: ./.github/workflows/checks.yml
