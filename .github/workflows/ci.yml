name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O nome do job precisa ser `ci` (os checks obrigatórios são `ci / lint`, `ci / test`...).
  # Toda a lógica (lint, testes, conformidade, regra de branch) vive em brunocvs7/ds-workflows.
  ci:
    uses: brunocvs7/ds-workflows/.github/workflows/python-ci.yml@v1
