[project]
name = "ds-project"
version = "0.1.0"
description = "Projeto de Data Science criado a partir do ds-project-template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_project"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
# Permite a convenção de DS: X, X_train, X_test (matrizes de features)
ignore = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
